name: ci
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required job. The native reference libraries are pinned to the exact versions inside the WebAssembly runtime
  # (requirements-ci.txt), so native-vs-WASM parity compares like with like and is reproducible.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: pip install -r requirements-ci.txt
      - run: python -m pytest -q                 # scientific engine + bridge + security tests
      - run: npm ci
      - run: npm run build                       # engine bundle, asset checksums, typecheck, production build
      - run: npm test                            # unit tests + WASM-vs-native parity
      - run: npm run test:e2e                    # real Chromium (downloaded via @sparticuz/chromium)
      - name: Upload diagnostics (parity record, E2E results, screenshots)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diagnostics
          path: |
            tests-web/parity-result.json
            tests-e2e/out/results.json
            tests-e2e/out/*.png
          if-no-files-found: ignore
          retention-days: 14

  # Informational drift detector: newest releases of the native libraries. A failure here is visible but does not block;
  # it means a newer NumPy/OpenCV/SciPy/Shapely behaves differently from the pinned, shipped WebAssembly runtime.
  latest-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: pip install numpy opencv-python-headless scipy shapely pytest
      - run: python -m pip list | grep -i -E "numpy|opencv|scipy|shapely"
      - run: python -m pytest -q
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diagnostics-latest-deps
          path: tests-web/parity-result.json
          if-no-files-found: ignore
          retention-days: 14
